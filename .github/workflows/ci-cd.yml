name: SparkleWash CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (Syntax & Build Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Backend Code
        run: |
          cd backend
          npm run check

  frontend-ci:
    name: Frontend CI (Lint & Production Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  deploy:
    name: Automated Deployment to AWS EC2
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: SSH & Deploy to AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting automated deployment on AWS EC2 server..."
            cd ${{ secrets.AWS_EC2_PATH }} || mkdir -p ${{ secrets.AWS_EC2_PATH }} && cd ${{ secrets.AWS_EC2_PATH }}
            
            if [ ! -d ".git" ]; then
              echo "⚠️ No git repository found on server! Converting directory to Git repository..."
              git init
              git remote add origin https://github.com/tech-aj99/sparklewash---smartwash-management-system.git || git remote set-url origin https://github.com/tech-aj99/sparklewash---smartwash-management-system.git
            fi
            
            echo "📥 Syncing latest code from GitHub..."
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            
            echo "📦 Updating Backend..."
            cd backend
            npm install --production
            
            echo "🎨 Updating Frontend..."
            cd ../frontend
            npm install
            npm run build
            
            echo "🌐 Syncing Frontend with Nginx & Reloading..."
            NGINX_ROOT=$(grep -rh "root " /etc/nginx/ 2>/dev/null | grep -v "#" | grep "/" | head -n 1 | awk '{print $2}' | tr -d ';')
            echo "Detected Nginx root: $NGINX_ROOT"
            
            if [ -n "$NGINX_ROOT" ] && [ -d "$NGINX_ROOT" ]; then
              sudo cp -r dist/* "$NGINX_ROOT/" 2>/dev/null || true
            fi
            
            sudo cp -r dist/* /var/www/html/ 2>/dev/null || true
            sudo cp -r dist/* /var/www/sparklewash/ 2>/dev/null || true
            sudo cp -r dist/* ../dist/ 2>/dev/null || true
            
            sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || true
            
            echo "🔄 Restarting Backend Application..."
            cd ../backend
            pm2 restart all || pm2 start server.js --name "sparklewash-backend"
            
            echo "✅ Deployment completed successfully on sparklewash.in!"
